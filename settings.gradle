pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Herald is consumed from ~/.m2 until its first Maven Central release; publish it there
        // with `./gradlew publishToMavenLocal` in the herald repository.
        mavenLocal {
            content { includeGroup 'io.github.mkhytarmkhoian' }
        }
        google()
        mavenCentral()
    }
}

rootProject.name = "Moove"
include ':app'
include ':shared'
include ':design-system'
include ':tickets'
include ':movies'
include ':core'
include ':analytics'
