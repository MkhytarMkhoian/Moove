pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Local Herald builds, for trying a change before it's released: publish one with
        // `./gradlew publishToMavenLocal -Pversion=1.2.0-SNAPSHOT` in the herald repository and
        // set that version in gradle/libs.versions.toml. Snapshots only, so a release always
        // comes from Maven Central.
        mavenLocal {
            content { includeGroup 'io.github.mkhytarmkhoian' }
            mavenContent { snapshotsOnly() }
        }
    }
}

rootProject.name = "Moove"
include ':app'
include ':shared'
include ':design-system'
include ':tickets'
include ':movies'
include ':core'
include ':analytics'
include ':inspector'
