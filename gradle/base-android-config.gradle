android {
    compileSdk androidSetup.compileSdkVersion

    defaultConfig {
        minSdk androidSetup.minSdkVersion
        targetSdk androidSetup.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    def shrinks = project.plugins.hasPlugin('com.android.application')

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        review {
            minifyEnabled shrinks
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release']
        }
        release {
            minifyEnabled shrinks
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
        dataBinding false
        viewBinding true
    }

    lint {
        abortOnError true
        ignoreWarnings false
        disable += ['WrongConstant',
                'ContentDescription',
                'VectorPath', 'VectorRaster',
                'Typos', 'TypographyDashes', 'TypographyEllipsis', 'PluralsCandidate', 'ButtonCase']
        lintConfig file("${rootProject.projectDir}/lint.xml")
    }
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll(
                '-opt-in=kotlin.RequiresOptIn',
                '-opt-in=kotlin.ExperimentalStdlibApi',
                '-opt-in=kotlin.contracts.ExperimentalContracts',
                '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
                '-opt-in=kotlinx.coroutines.FlowPreview',
        )
    }
}

tasks.withType(Test).configureEach {
    testLogging {
        events "failed", "standardError"
    }
}

dependencies {
    // region Tools
    coreLibraryDesugaring libs.android.tools.desugar
    // endregion
}
