plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

apply from: "${rootProject.projectDir}/gradle/base-android-config.gradle"
apply from: "${rootProject.projectDir}/gradle/compose-android-config.gradle"

def tmdbProperties = new Properties()
def tmdbPropertiesFile = rootProject.file('local.properties')
if (tmdbPropertiesFile.exists()) {
    tmdbProperties.load(new FileInputStream(tmdbPropertiesFile))
}
def tmdbApiKey = tmdbProperties.getProperty('tmdb.apiKey', '')

android {
    namespace 'com.moove.movies'

    defaultConfig {
        buildConfigField "String", "TMDB_API_KEY", "\"$tmdbApiKey\""
        buildConfigField "String", "TMDB_BASE_URL", "\"https://api.themoviedb.org/3/\""
        buildConfigField "String", "TMDB_IMAGE_BASE_URL", "\"https://image.tmdb.org/t/p/\""
    }
}

dependencies {

    implementation project(':shared')

    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.androidx.hilt.navigation.fragment
    implementation libs.androidx.hilt.navigation.compose

    ksp libs.moshi.compiler

    testImplementation libs.bundles.tests.unit
    testImplementation libs.bundles.tests.viewmodel
    androidTestImplementation libs.bundles.tests.android
}
